name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "server.js"
      - "package.json"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when VPS secrets are missing
        if: env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_PASSWORD == ''
        run: |
          echo "VPS deployment secrets are not configured; skipping backend deploy."

      - name: Upload backend files
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_PASSWORD != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          source: "server.js,package.json,public"
          target: "/opt/cs2-monitor/app"
          overwrite: true

      - name: Restart backend
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_PASSWORD != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          script: |
            systemctl restart cs2-monitor.service
            systemctl --no-pager --full status cs2-monitor.service
